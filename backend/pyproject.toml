[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackore-ai-research-agent"
version = "0.1.0"
description = "Evidence-driven autonomous AI research platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "langgraph",
    "openai",
    "pydantic-settings",
    "tavily-python",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
