[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackore-ai-research-agent"
version = "1.0.0"
description = "Evidence-driven AI research backend with source-grounded reports and verified citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "openai==3.13.0",
    "pydantic-settings==2.15.0",
    "tavily-python==0.8.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
